# Local development services for Orbit.
# Elasticsearch powers the search module. Security is disabled and memory is
# capped for a lightweight single-node dev setup — do not use in production.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: orbit-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    # Host port 9201 to avoid clashing with other local ES instances.
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - orbit_es_data:/usr/share/elasticsearch/data

volumes:
  orbit_es_data:
